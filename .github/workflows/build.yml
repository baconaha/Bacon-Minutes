name: build

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    # Intel runner: the Apple Silicon queue was turning jobs away for lack of capacity.
    # The build is still universal (arm64 + x86_64).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Check translations
        run: python3 tools/check_l10n.py
      - name: Core unit tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app (Release, universal, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project BaconMinutes.xcodeproj -scheme BaconMinutes -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            build > build.log 2>&1
      - name: Show errors
        if: failure()
        run: grep -n "error:" build.log | head -200 || true
      - name: Make DMG
        run: |
          APP="build/Build/Products/Release/Bacon Minutes.app"
          codesign --verify --verbose "$APP"
          # Every UI language must ship its strings table and localized app name.
          for l in en ja ko es vi fr pt ru; do
            plutil -lint "$APP/Contents/Resources/$l.lproj/Localizable.strings"
            plutil -lint "$APP/Contents/Resources/$l.lproj/InfoPlist.strings"
          done
          plutil -p "$APP/Contents/Resources/zh-Hans.lproj/InfoPlist.strings"
          plutil -extract "全部" raw "$APP/Contents/Resources/ja.lproj/Localizable.strings"
          mkdir -p dist/stage
          cp -R "$APP" dist/stage/
          ln -s /Applications dist/stage/Applications
          hdiutil create -volname "Bacon Minutes" -srcfolder dist/stage -ov -format UDZO dist/BaconMinutes.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: BaconMinutes-dmg
          path: dist/BaconMinutes.dmg
